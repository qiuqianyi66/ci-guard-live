name: ci-guard reusable

# 可被其他仓库直接引用的门禁。调用方三行即可：
#
#   jobs:
#     guard:
#       uses: qiuqianyi66/ci-guard-live/.github/workflows/reusable-guard.yml@main
#
# 本 workflow 会自行检出 ci-guard 源码到 .ci-guard-src，不需要调用方复制任何文件。
# 只判可机械判定的子集；不联网、不执行被检仓的代码。
# 自身三个 action 全部 pin 到 commit SHA（SHA 于 2026-11-14 用 git ls-remote 取）。

on:
  workflow_call:
    inputs:
      repo-path:
        description: 被检仓路径（调用方 checkout 后的相对路径）
        type: string
        required: false
        default: "."
      strict:
        description: true 时 WARN 也算失败
        type: boolean
        required: false
        default: false
      baseline:
        description: 基线文件路径；文件存在则只报新增（存量仓上线的默认路径）
        type: string
        required: false
        default: ".ci-guard-baseline.json"
      source-ref:
        description: 取哪一版 ci-guard；建议用 tag 而不是 main，避免结论随上游漂移
        type: string
        required: false
        default: "v0.3.3"

permissions:
  contents: read

jobs:
  guard:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout caller repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      # 关键一步：源码取自 ci-guard 本体，而不是调用方仓。
      # 用 uses: 引用时，调用方仓里并没有 ci_guard.py。
      - name: Checkout ci-guard source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: qiuqianyi66/ci-guard-live
          ref: ${{ inputs.source-ref }}
          path: .ci-guard-src
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      # 钉版本：门禁不该因为 pyyaml 发了新版就改变结论。
      - name: Install pyyaml
        run: python -m pip install --disable-pip-version-check pyyaml==6.0.3

      - name: Run ci-guard
        run: |
          set -euo pipefail
          STRICT_FLAG=""
          if [ "${{ inputs.strict }}" = "true" ]; then STRICT_FLAG="--strict"; fi
          BASE_FLAG=""
          if [ -f "${{ inputs.baseline }}" ]; then BASE_FLAG="--baseline ${{ inputs.baseline }}"; fi
          python .ci-guard-src/tools/ci-guard/ci_guard.py "${{ inputs.repo-path }}" $STRICT_FLAG $BASE_FLAG

      - name: Emit SARIF
        if: always()
        run: |
          set -euo pipefail
          python .ci-guard-src/tools/ci-guard/ci_guard.py "${{ inputs.repo-path }}" \
            --sarif ci-guard.sarif --json > /dev/null || true

      - name: Upload SARIF
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ci-guard-sarif
          path: ci-guard.sarif
          retention-days: 7
