name: ci-guard

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - run: pip install pyyaml==6.0.3
      - run: python tools/ci-guard/ci_guard.py . --baseline .ci-guard-baseline.json --format=github
